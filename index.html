<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World clock ⏰</title>
    <link rel="stylesheet" href="src/index.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.31.0/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.6/moment-timezone-with-data-1970-2030.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>
          <span class="title1">What</span>
          <span class="title2">time</span> <span class="title3">is </span
          ><span class="title4">it</span> <span class="title5">?</span>
        </h1>
      </header>
      <select id="chosen-city">
        <option value="">Choose a city</option>
        <option value="barcelona">🇪🇸 Barcelona</option>
        <option value="vienna">🇦🇹 Vienna</option>
        <option value="milan">🇮🇹 Milan</option>
      </select>
      <div class="fixed-city">
        <div>
          <h2>🇦🇺 Melbourne</h2>
          <div class="current-date">Saturday 22nd November 2026</div>
        </div>
        <div class="current-time">4:04 <small>PM</small></div>
      </div>
      <div class="fixed-city">
        <div>
          <h2>🇦🇷 Rada Tilly</h2>
          <div class="current-date">Saturday 22nd November 2026</div>
        </div>
        <div class="current-time">4:04 <small>PM</small></div>
      </div>
      <br />
    </div>
    <footer>
      This page was coded by
      <a href="https://github.com/Car-acu" target="_blank">Caro Acuna</a>. It is
      <a href="https://github.com/Car-acu/World-clock" target="_blank"
        >open-sourced on Github</a
      >
      and hosted on
      <a href="https://caracu-what-time-is-it.netlify.app/" target="_blank"
        >Netlify</a
      >
    </footer>
    <script src="src/index.js"></script>
  </body>
</html>
